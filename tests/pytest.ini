[pytest]
# Run from the repository root:  python -m pytest tests
#
# This file lives in tests/ rather than at the repository root so pytest picks
# `tests` as its rootdir. That matters because the plugin root is itself a
# Python package (it has `__init__.py`, because Hermes loads the directory with
# spec_from_file_location(.., submodule_search_locations=[plugin_dir])). With
# the root as rootdir, the collector climbs out of the repository and tries to
# import that `__init__.py` as a top-level module, which cannot work, and is
# not a real defect in the plugin.
#
# There is also no pyproject.toml beside plugin.yaml on purpose: Hermes treats
# one as the plugin's Python dependency declaration, and this plugin has none.
addopts = -q
